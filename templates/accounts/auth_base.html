{% extends "base.html" %}
{% block content %}
<div class="container-page grid min-h-[70vh] place-items-center py-10">
  <div class="w-full max-w-md">
    <div class="card p-6 sm:p-8">
      <h1 class="text-2xl font-bold tracking-tight">{% block heading %}{% endblock %}</h1>
      <p class="mt-1 text-sm text-ink-2">{% block subheading %}{% endblock %}</p>
      <div class="mt-6">{% block form %}{% endblock %}</div>
    </div>
    <div class="mt-4 text-center text-sm text-ink-2">{% block below %}{% endblock %}</div>
  </div>
</div>
{% endblock %}
