{% if form.non_field_errors %}
  <div class="alert alert-danger" role="alert">{% icon "triangle-alert" "mt-0.5 size-4 shrink-0" %}<div class="font-medium">{% for e in form.non_field_errors %}{{ e }}{% if not forloop.last %}<br>{% endif %}{% endfor %}</div></div>
{% elif form.errors %}
  <div class="alert alert-danger" role="alert">{% icon "triangle-alert" "mt-0.5 size-4 shrink-0" %}<div class="font-medium">Please fix the highlighted fields.</div></div>
{% endif %}
